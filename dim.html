<script>
(function(){
  const qs = new URLSearchParams(location.search);
  const d = qs.get('d'), s = qs.get('s');
  const h = document.getElementById('h'), crumb = document.getElementById('crumb');
  const agg = document.getElementById('agg'), c3el = document.getElementById('c3');
  const rowsEl = document.getElementById('rows'), cntEl = document.getElementById('cnt');
  const moreBtn = document.getElementById('more');
  const fail = m => { h.textContent = '无法渲染'; showErr(document.getElementById('agg'), m); };

  if (!d || !s) { fail('缺少参数：需要 ?d=<维度>&s=<值>'); return; }
  if (DIMS_ORDER.indexOf(d) < 0) { fail('未知维度：' + d); return; }

  crumb.textContent = DIM_LABEL[d] || d;

  fetchT('data/dims/index.json').then(idx => {
    const dim = idx.dims[d];
    if (!dim) throw new Error('维度不存在：' + d);
    const val = dim.values.find(v => v.k === s);
    const label = val ? val.label : s;
    h.innerHTML = esc(label) +
      ' <span class="lic" style="font-size:var(--fs-14)">' + esc(DIM_LABEL[d]) + '</span>';
    document.title = label + ' · ' + (DIM_LABEL[d] || d) + ' · mid.midicn.com';

    /* 作曲家 slug → 显示名（供非 composer 维度的行内作曲家列） */
    const compNames = new Map((idx.dims.composer ? idx.dims.composer.values : [])
      .map(v => [v.k, v.label]));

    return fetchT(shardUrl(d, s)).then(sh => {
      const rows = sh.rows || [];
      const aggT = tierAgg(rows);
      agg.innerHTML = '<span class="meta">' +
        ['C1','C2','C3'].map(c => {
          const t = tierOf(c === 'C1' ? 'main' : c === 'C2' ? 'piano-special' : 'study');
          return '<span class="lic ' + t.cls + '">' + c + '</span> ' + aggT[c] + ' 首';
        }).join(' · ') + '</span>';
      c3el.innerHTML = aggT.C3 > 0
        ? '<div class="note">本页含<b>学习研究（C3）</b>曲目 ' + aggT.C3 +
          ' 首：仅供学习与研究，不得再分发、不得商用。</div>' : '';
      cntEl.textContent = '共 ' + rows.length.toLocaleString('en-US') + ' 首';

      const draw = (limit) => {
        rowsEl.innerHTML = rows.slice(0, limit).map(r => rowHTML(r, compNames)).join('');
        moreBtn.hidden = rows.length <= limit;
        moreBtn.textContent = '加载全部（共 ' + rows.length.toLocaleString('en-US') + ' 首，当前显示 ' +
          Math.min(limit, rows.length).toLocaleString('en-US') + '）';
      };
      let shown = 1000;
      draw(shown);
      moreBtn.onclick = () => { shown = rows.length; draw(shown); };
    });
  }).catch(e => fail(e.message || e));
})();
</script>
