<script src="assets/site.js"></script>
<script>
(function(){
  const app = document.getElementById('app');
  fetchT('data/dims/index.json').then(idx => {
    if (idx.version) document.getElementById('ver').textContent = '数据版本 ' + idx.version;
    const dims = idx.dims;
    const order = DIMS_ORDER.filter(d => dims[d]);
    app.innerHTML = order.map(d => {
      const v = dims[d];
      const listId = 'list-' + d;
      const big = v.values.length > 300;
      return '<div class="stitle"><h2>' + esc(v.label) + '</h2>' +
        '<span class="spacer"></span><span class="meta">' + v.values.length + ' 项 · ' +
        fmtNum(v.tracks) + ' 首</span></div>' +
        (d === 'composer' ? '<p class="meta">输入可过滤（共 ' + v.values.length + ' 位）</p>' +
          '<p class="filterbox"><input id="cf" type="search" placeholder="过滤作曲家…"></p>' : '') +
        '<div class="vals" id="' + listId + '"' + (big ? ' data-big="1"' : '') + '></div>';
    }).join('');

    order.forEach(d => {
      const v = dims[d];
      const el = document.getElementById('list-' + d);
      const chip = x => '<a class="val" href="dim.html?d=' + encodeURIComponent(d) +
        '&s=' + encodeURIComponent(x.k) + '">' + esc(x.label) +
        '<span class="cnt">' + fmtNum(x.count) + '</span></a>';
      if (d === 'composer') {
        const input = document.getElementById('cf');
        const draw = q => {
          const qq = (q || '').trim().toLowerCase();
          const hit = v.values.filter(x => !qq || x.label.toLowerCase().includes(qq) || x.k.includes(qq));
          el.innerHTML = hit.slice(0, 200).map(chip).join('') ||
            '<span class="meta">无匹配</span>';
          if (hit.length > 200) el.insertAdjacentHTML('beforeend',
            '<span class="meta">…仅显示前 200 / ' + hit.length + '，请继续输入缩小范围</span>');
        };
        input.addEventListener('input', () => draw(input.value));
        draw('');
      } else {
        el.innerHTML = v.values.map(chip).join('');
      }
    });
  }).catch(e => showErr(app, e.message || e));

  function fmtNum(n){ return Number(n).toLocaleString('en-US'); }
})();
</script>
</body>
</html>
